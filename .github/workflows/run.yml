name: 每天按顺序发布两条
on:
  schedule:
    - cron: '17 2 * * *' # 北京时间每天 10:17
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: telegram-reposter
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 发送帖子
        id: publish
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TARGET_CHAT: ${{ vars.TARGET_CHAT }}
          SOURCE_CHAT: ${{ vars.SOURCE_CHAT }}
        run: python main.py
      - name: 保存发布进度
        run: |
          if ! git diff --quiet -- state.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add state.json
            git commit -m 'Update posting progress'
            git push
          fi
      - name: 标记发布错误
        if: steps.publish.outcome == 'failure'
        run: exit 1
